<div class="min-h-screen bg-[#FFFBF0] py-12 px-4">
  <div class="max-w-xl mx-auto">
    
    <button routerLink="/profile" class="text-orange-600 font-bold mb-6 flex items-center gap-2 hover:underline">
      ← {{ 'NAV.BACK' | translate }}
    </button>

    <div class="bg-white rounded-3xl p-8 shadow-xl border border-orange-100">
      <div class="text-center mb-8">
        <h2 class="text-3xl font-black text-orange-900">{{ 'ADMIN.REGISTER_TITLE' | translate }}</h2>
        <p class="text-gray-500 mt-2 text-sm">{{ 'ADMIN.REGISTER_SUBTITLE' | translate }}</p>
      </div>

      <div *ngIf="successMessage" class="mb-6 p-4 bg-green-50 border border-green-100 rounded-2xl text-green-700 font-bold text-sm flex items-center gap-2">
        ✅ {{ successMessage | translate }}
      </div>

      <div *ngIf="errorMessage" class="mb-6 p-4 bg-red-50 border border-red-100 rounded-2xl text-red-700 font-bold text-sm">
        ❌ {{ errorMessage | translate }}
      </div>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <div>
          <label class="block text-xs font-black text-gray-400 uppercase tracking-widest mb-2 ml-1">
            {{ 'AUTH.PHONE_LABEL' | translate }}
          </label>
          <input type="text" formControlName="phone" 
                 class="w-full px-4 py-4 rounded-2xl border border-gray-100 bg-gray-50 focus:bg-white focus:border-orange-500 outline-none transition-all"
                 placeholder="77071234567">
        </div>

        <button type="submit" [disabled]="registerForm.invalid || isLoading"
                class="w-full bg-orange-600 hover:bg-orange-700 disabled:bg-gray-200 text-white font-black py-5 rounded-2xl shadow-lg shadow-orange-100 transition-all flex justify-center items-center gap-3">
          <div *ngIf="isLoading" class="animate-spin h-5 w-5 border-2 border-white border-t-transparent rounded-full"></div>
          {{ isLoading ? ('ADMIN.CREATING' | translate) : ('ADMIN.REGISTER_BUTTON' | translate) }}
        </button>
      </form>
    </div>

    <p class="text-center mt-8 text-gray-400 text-[10px] font-bold uppercase tracking-widest">
      {{ 'ADMIN.RESTRICTION_NOTE' | translate }}
    </p>
  </div>
</div>
